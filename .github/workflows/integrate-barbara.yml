name: Integrate Barbara Command Center

on:
  workflow_dispatch:
  push:
    branches:
      - feature/barbara-command-center
    paths:
      - scripts/integrate-barbara-command-center.mjs
      - .github/workflows/integrate-barbara.yml
  pull_request:
    branches:
      - main
    paths:
      - src/lib/barbaraCommandCenter.ts
      - scripts/integrate-barbara-command-center.mjs
      - .github/workflows/integrate-barbara.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  integrate-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/barbara-command-center
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Integrate Barbara
        run: node scripts/integrate-barbara-command-center.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit integration
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "Barbara is already integrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "feat: integrate Barbara command center"
          git push origin HEAD:feature/barbara-command-center
