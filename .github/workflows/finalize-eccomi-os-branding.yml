name: Finalize ECCOMI OS Branding

on:
  push:
    branches:
      - main
    paths:
      - scripts/finalize-eccomi-os-branding.mjs
      - .github/workflows/finalize-eccomi-os-branding.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply final branding
        run: node scripts/finalize-eccomi-os-branding.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit branding update
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "No branding changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "chore: finalize ECCOMI OS 0.1 branding"
          git push origin main
